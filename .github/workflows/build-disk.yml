---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
      flavor:
        description: "Image to build disk images for"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - base
          - nvidia
          - nvidia-open
  pull_request:
    branches:
      - main
    paths:
      - './installer/**'
      - './build_files/titanoboa-iso.sh'
      - './disk_config/disk.toml'
      - './.github/workflows/build-disk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  flavors:
    name: Load disk flavors
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build flavor matrix
        id: matrix
        run: |
          set -a
          . ./image.env
          set +a

          requested="${{ inputs.flavor }}"
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ inputs.platform }}" == "arm64" ]]; then
            requested="base"
          elif [[ "${requested}" == "all" || -z "${requested}" ]]; then
            requested="base ${IMAGE_FLAVORS}"
          fi

          matrix="$(jq -cn \
            --arg image_name "${IMAGE_NAME,,}" \
            --arg flavors "${requested}" \
            '["qcow2","live-iso"] as $disks |
             ($flavors | split(" ") | map(select(length > 0) | if . == "base" then {target_image: $image_name, flavor: ""} else {target_image: ($image_name + "-" + .), flavor: .} end)) as $images |
             {include: [$images[] as $img | $disks[] as $disk | $img + {disk_type: $disk}]}')"

          echo "Disk matrix: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target_image }} (${{ matrix.disk_type }})
    needs: flavors
    runs-on: ${{ (inputs.platform == 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.flavors.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk_type }}" | tr ' ' '-')
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}
          echo "OUTPUT_DIR=${GITHUB_WORKSPACE}/output" >> ${GITHUB_ENV}

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Install podman
        if: matrix.disk_type == 'live-iso'
        run: |
          set -x
          sudo apt-get update -y
          sudo apt-get install -y podman btrfs-progs

      - name: Mount container storage loopback
        if: matrix.disk_type == 'live-iso'
        run: |
          set -euxo pipefail
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp /var/lib/containers/storage
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load image configuration
        run: |
          set -a
          . ./image.env
          set +a
          image_repo="${MAKOS_IMAGE%/*}"
          installer_name="${INSTALLER_IMAGE_NAME}"
          if [[ -n "${{ matrix.flavor }}" ]]; then
            installer_name+="-${{ matrix.flavor }}"
          fi
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "REPO_ORGANIZATION=${REPO_ORGANIZATION,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "TARGET_IMAGE=${{ matrix.target_image }}"
            echo "IMAGE_FLAVOR=${{ matrix.flavor }}"
            echo "DEFAULT_TAG=${DEFAULT_TAG}"
            echo "MAKOS_IMAGE=${MAKOS_IMAGE,,}"
            echo "CONTAINER_IMAGE=${image_repo,,}/${{ matrix.target_image }}:${DEFAULT_TAG}"
            echo "INSTALLER_IMAGE_NAME=${installer_name,,}"
            echo "INSTALLER_IMAGE=localhost/${installer_name,,}:${DEFAULT_TAG}"
            echo "IMAGE_REPO=${image_repo,,}"
          } >> "$GITHUB_ENV"

      - name: Build qcow2 image
        if: matrix.disk_type == 'qcow2'
        run: |
          set -euxo pipefail
          mkdir -p "$OUTPUT_DIR"
          sudo podman pull "${CONTAINER_IMAGE}"
          sudo podman run --rm \
            --privileged \
            --net=host \
            --security-opt label=disable \
            --security-opt apparmor=unconfined \
            --security-opt seccomp=unconfined \
            -v "$PWD/disk_config/disk.toml:/config.toml:ro" \
            -v "$OUTPUT_DIR:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build \
            --output /output \
            --chown "${USER_UID}:${USER_GID}" \
            --rootfs btrfs \
            --use-librepo=True \
            --type qcow2 \
            "${CONTAINER_IMAGE}"

      - name: Build installer container
        if: matrix.disk_type == 'live-iso'
        run: |
          set -euxo pipefail
          mkdir -p "$OUTPUT_DIR"
          image="${CONTAINER_IMAGE}"
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="$image" \
            --build-arg INSTALL_IMAGE_PAYLOAD="$image" \
            -t "${INSTALLER_IMAGE}" \
            installer/

      - name: Build live ISO
        if: matrix.disk_type == 'live-iso'
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4 # main
        with:
          image-ref: ${{ env.INSTALLER_IMAGE }}
          iso-dest: /tmp/${{ matrix.target_image }}-Live.iso

      - name: Move live ISO into output
        if: matrix.disk_type == 'live-iso'
        run: |
          set -euxo pipefail
          mkdir -p "$OUTPUT_DIR"
          mv "/tmp/${{ matrix.target_image }}-Live.iso" "$OUTPUT_DIR/${{ matrix.target_image }}-Live.iso"

      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          cd "$OUTPUT_DIR"
          while IFS= read -r -d '' file; do
            sha256sum "$file" > "$file-CHECKSUM"
          done < <(find . -type f \( -name '*.iso' -o -name '*.qcow2' \) -print0)
          ls -lh

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target_image }}-${{ matrix.disk_type }}
          path: ${{ github.workspace }}/output
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ github.workspace }}/output
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "$SOURCE_DIR" "S3:${{ secrets.S3_BUCKET_NAME }}/${{ matrix.target_image }}"
