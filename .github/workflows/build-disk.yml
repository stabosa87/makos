---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './installer/**'
      - './disk_config/disk.toml'
      - './.github/workflows/build-disk.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ (inputs.platform == 'arm64') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "live-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}
          echo "OUTPUT_DIR=${GITHUB_WORKSPACE}/output" >> ${GITHUB_ENV}

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Install podman
        if: matrix.disk-type == 'live-iso'
        run: |
          set -x
          sudo apt-get update -y
          sudo apt-get install -y podman btrfs-progs

      - name: Mount container storage loopback
        if: matrix.disk-type == 'live-iso'
        run: |
          set -euxo pipefail
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service || true
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp /var/lib/containers/storage
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load image configuration
        run: |
          set -a
          . ./image.env
          set +a
          image_repo="${MAKOS_IMAGE%/*}"
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "REPO_ORGANIZATION=${REPO_ORGANIZATION,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "DEFAULT_TAG=${DEFAULT_TAG}"
            echo "MAKOS_IMAGE=${MAKOS_IMAGE,,}"
            echo "BASE_IMAGE=${BASE_IMAGE}"
            echo "INSTALLER_IMAGE_NAME=${INSTALLER_IMAGE_NAME,,}"
            echo "INSTALLER_IMAGE=${INSTALLER_IMAGE,,}"
            echo "IMAGE_REPO=${image_repo,,}"
          } >> "$GITHUB_ENV"

      - name: Build qcow2 image
        if: matrix.disk-type == 'qcow2'
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./disk_config/disk.toml
          image: ${{ env.MAKOS_IMAGE }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: qcow2
          additional-args: --use-librepo=True

      - name: Collect qcow2 output
        if: matrix.disk-type == 'qcow2'
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          src="$(realpath '${{ steps.build.outputs.output-directory }}')"
          dst="$(realpath "$OUTPUT_DIR")"
          if [[ "$src" != "$dst" ]]; then
            cp -a "$src"/. "$dst"/
          fi

      - name: Build installer container
        if: matrix.disk-type == 'live-iso'
        run: |
          set -euxo pipefail
          image="${MAKOS_IMAGE}"
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="$image" \
            --build-arg INSTALL_IMAGE_PAYLOAD="$image" \
            -t "${INSTALLER_IMAGE}" \
            installer/

      - name: Build live ISO
        if: matrix.disk-type == 'live-iso'
        run: |
          set -euxo pipefail
          mkdir -p "$OUTPUT_DIR"
          sudo podman run --rm \
            --cap-add sys_admin \
            --security-opt label=disable \
            -v "$OUTPUT_DIR:/output" \
            -v /var/lib/containers/storage:/usr/lib/containers/storage:ro \
            --mount type=image,source="${INSTALLER_IMAGE}",dst=/rootfs \
            ghcr.io/ublue-os/titanoboa:latest
          sudo chown -R "$USER_UID:$USER_GID" "$OUTPUT_DIR"
          test -f "$OUTPUT_DIR/MakOS-Live.iso"

      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          cd "$OUTPUT_DIR"
          while IFS= read -r -d '' file; do
            sha256sum "$file" > "$file-CHECKSUM"
          done < <(find . -type f \( -name '*.iso' -o -name '*.qcow2' \) -print0)
          ls -lh

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ github.workspace }}/output
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ github.workspace }}/output
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
