---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  flavors:
    name: Load image flavors
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build flavor matrix
        id: matrix
        run: |
          set -a
          . ./image.env
          set +a
          for flavor in ${IMAGE_FLAVORS}; do
            test -f "build_files/flavors/${flavor}.sh" || {
              echo "Missing flavor script: build_files/flavors/${flavor}.sh" >&2
              exit 1
            }
          done
          matrix="$(jq -cn \
            --arg image_name "${IMAGE_NAME,,}" \
            --arg flavors "${IMAGE_FLAVORS}" \
            '{include: ([{target_image: $image_name, flavor: ""}] + ($flavors | split(" ") | map(select(length > 0) | {target_image: ($image_name + "-" + .), flavor: .})))}')"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build_push:
    name: Build and push ${{ matrix.target_image }}
    needs: flavors
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.flavors.outputs.matrix) }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Load image configuration
        run: |
          set -a
          . ./image.env
          set +a
          image_repo="${MAKOS_IMAGE%/*}"
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "REPO_ORGANIZATION=${REPO_ORGANIZATION,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "TARGET_IMAGE=${{ matrix.target_image }}"
            echo "IMAGE_FLAVOR=${{ matrix.flavor }}"
            echo "DEFAULT_TAG=${DEFAULT_TAG}"
            echo "MAKOS_IMAGE=${MAKOS_IMAGE,,}"
            echo "INSTALLER_IMAGE_NAME=${INSTALLER_IMAGE_NAME,,}"
            echo "INSTALLER_IMAGE=${INSTALLER_IMAGE,,}"
            echo "IMAGE_REPO=${image_repo,,}"
          } >> "$GITHUB_ENV"

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          if [[ -n "${IMAGE_FLAVOR}" ]]; then
            just build \
              "${TARGET_IMAGE}" \
              "${DEFAULT_TAG}" \
              "${IMAGE_FLAVOR}"
          else
            just build \
              "${TARGET_IMAGE}" \
              "${DEFAULT_TAG}"
          fi

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            ${TARGET_IMAGE} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${TARGET_IMAGE} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${TARGET_IMAGE}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${TARGET_IMAGE}:${tag} ${IMAGE_REPO}/${TARGET_IMAGE}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          if [[ -z "${COSIGN_PASSWORD:-}" ]]; then
            echo "::error::COSIGN_PASSWORD secret is not set."
            exit 1
          fi

          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REPO}/${TARGET_IMAGE}@${DIGEST}

